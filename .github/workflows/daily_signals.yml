name: Daily Trading Signals

on:
  # Run every weekday at 7:30 PM IST = 14:00 UTC.
  # Allow more time for EOD files; publication is still verified, never assumed.
  schedule:
    - cron: "0 14 * * 1-5"

  # Also allow manual trigger from GitHub UI or phone
  workflow_dispatch:

jobs:
  send-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIGNAL_BHAVCOPY_FOLDER: data/signal-bhavcopy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      # Restore the market data CSVs from the previous run.
      # This means the runner only needs to fetch the last 1-2 days
      # incrementally instead of a full 400-day download, which is far
      # less likely to be blocked by Yahoo Finance.
      - name: Restore market data cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: market-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-data-${{ runner.os }}-

      # One bounded snapshot per IST date, rather than one per workflow run.
      - name: Determine option cache date
        id: option-date
        run: echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore recent option archives
        id: option-cache
        uses: actions/cache/restore@v4
        with:
          path: data/signal-bhavcopy
          key: option-recent-v1-${{ runner.os }}-${{ steps.option-date.outputs.date }}
          restore-keys: |
            option-recent-v1-${{ runner.os }}-

      - name: Expire old signal-cache files
        run: python -m algo_trading.data.cache_retention

      # Generation prepares the exact-session bhavcopy with bounded retries.
      # A missing archive produces a data-status alert, not executable trades.
      - name: Generate daily watchlist report
        run: python main.py daily-report

      - name: Upload daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-options-report
          retention-days: 7
          path: reports/daily-signals/
          if-no-files-found: ignore

      # Always save the updated CSVs so the next run can use them.
      # The cache key includes run_id so a fresh entry is saved each time.
      - name: Save market data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: market-data-${{ runner.os }}-${{ github.run_id }}

      - name: Save recent option archives
        if: success() && steps.option-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/signal-bhavcopy
          key: option-recent-v1-${{ runner.os }}-${{ steps.option-date.outputs.date }}

      - name: Upload option-data diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-data-status
          retention-days: 7
          path: reports/signal-data/
          if-no-files-found: ignore
