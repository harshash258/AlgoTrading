name: Daily Trading Signals

on:
  # Run every weekday at 4:15 PM IST = 10:45 UTC
  # (45 min after market close — ensures yfinance has today's candle)
  schedule:
    - cron: "45 10 * * 1-5"

  # Also allow manual trigger from GitHub UI or phone
  workflow_dispatch:

jobs:
  send-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the market data CSVs from the previous run.
      # This means the runner only needs to fetch the last 1-2 days
      # incrementally instead of a full 400-day download, which is far
      # less likely to be blocked by Yahoo Finance.
      - name: Restore market data cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: market-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-data-${{ runner.os }}-

      - name: Generate and send signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/telegram_notify.py

      # Always save the updated CSVs so the next run can use them.
      # The cache key includes run_id so a fresh entry is saved each time.
      - name: Save market data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: market-data-${{ runner.os }}-${{ github.run_id }}
